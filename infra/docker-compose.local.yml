services:
  db:
    image: postgres:16-alpine
    container_name: sklos_local_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sklos
      POSTGRES_PASSWORD: sklos_local_password
      POSTGRES_DB: sklos_local
    ports:
      - "5432:5432"
    volumes:
      - sklos_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sklos -d sklos_local"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: sklos_local_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  sklos_pg_data:
